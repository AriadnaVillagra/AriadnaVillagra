<svg width="720" height="440" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg">

  <!-- shadow -->
  <rect x="6" y="6" width="708" height="428" fill="#D1D5DB"/>

  <!-- window -->
  <rect x="0" y="0" width="708" height="428" fill="#E5E7EB"/>

  <!-- title bar -->
  <rect x="0" y="0" width="708" height="32" fill="#F2A7D5"/>

  <text x="14" y="21" font-family="monospace" font-size="13" fill="#1F2937">
    ~/ariadna/dev-dashboard
  </text>

  <!-- window buttons -->
  <rect x="662" y="11" width="10" height="10" fill="#FAF4B7"/>
  <rect x="646" y="11" width="10" height="10" fill="#CDF0EA"/>
  <rect x="630" y="11" width="10" height="10" fill="#F6C6EA"/>

  <!-- main background -->
  <rect x="14" y="46" width="680" height="380" fill="#F9F9F9"/>

  <!-- GRID LINES -->
  <line x1="360" y1="46" x2="360" y2="426" stroke="#E5E7EB"/>
  <line x1="14" y1="170" x2="694" y2="170" stroke="#E5E7EB"/>
  <line x1="14" y1="340" x2="694" y2="340" stroke="#E5E7EB"/>

  <!-- section title -->
  <text x="30" y="70" font-family="monospace" font-size="14" fill="#374151">
    Stack Usage
  </text>

  <!-- React -->
  <text x="30" y="100" font-family="monospace" font-size="11">React</text>
  <rect x="90" y="90" width="200" height="12" fill="#CDF0EA"/>
  <rect x="90" y="90" width="240" height="12" fill="none" stroke="#E5E7EB"/>

  <!-- Flutter -->
  <text x="30" y="122" font-family="monospace" font-size="11">Flutter</text>
  <rect x="90" y="112" width="180" height="12" fill="#FAF4B7"/>
  <rect x="90" y="112" width="240" height="12" fill="none" stroke="#E5E7EB"/>

  <!-- TypeScript -->
  <text x="30" y="144" font-family="monospace" font-size="11">TypeScript</text>
  <rect x="90" y="134" width="230" height="12" fill="#F6C6EA"/>
  <rect x="90" y="134" width="240" height="12" fill="none" stroke="#E5E7EB"/>

  <!-- stats panel -->
  <rect x="30" y="180" width="320" height="140" fill="#FFFFFF"/>

  <text x="46" y="205" font-family="monospace" font-size="11" fill="#6B7280">
    GitHub Stats
  </text>

  <!-- languages panel -->
  <rect x="370" y="180" width="300" height="140" fill="#FFFFFF"/>

  <text x="386" y="205" font-family="monospace" font-size="11" fill="#6B7280">
    Top Languages
  </text>

  <!-- console -->
  <rect x="30" y="350" width="640" height="60" fill="#111827"/>

  <text x="46" y="372" font-family="monospace" font-size="12" fill="#9CA3AF">
    &gt; building something interesting...
  </text>

  <text x="46" y="390" font-family="monospace" font-size="12" fill="#9CA3AF">
    &gt; status: works on my machine
  </text>

  <!-- daria -->
  <image
    href="https://raw.githubusercontent.com/AriadnaVillagra/AriadnaVillagra/main/assets/daria.gif"
    x="580"
    y="352"
    width="70"
  />

</svg>
