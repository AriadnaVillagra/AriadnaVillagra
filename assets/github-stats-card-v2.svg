<svg width="720" height="440" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg">

  <!-- shadow -->
  <rect x="6" y="6" width="708" height="428" rx="10" fill="#D1D5DB"/>

  <!-- window -->
  <rect x="0" y="0" width="708" height="428" rx="10" fill="#E5E7EB"/>

  <!-- title bar -->
  <rect x="0" y="0" width="708" height="32" rx="10" fill="#F2A7D5"/>

  <text x="14" y="21" font-family="monospace" font-size="13" fill="#1F2937">
    ~/ariadna/dev-dashboard
  </text>

  <!-- window buttons -->
  <circle cx="670" cy="16" r="5" fill="#FAF4B7"/>
  <circle cx="652" cy="16" r="5" fill="#CDF0EA"/>
  <circle cx="634" cy="16" r="5" fill="#F6C6EA"/>

  <!-- main bg -->
  <rect x="14" y="46" width="680" height="380" rx="6" fill="#F9F9F9"/>

  <!-- section title -->
  <text x="30" y="70" font-family="monospace" font-size="14" fill="#374151">
    Stack Usage
  </text>

  <!-- progress bars -->

  <!-- React -->
  <rect x="30" y="90" width="300" height="12" rx="6" fill="#E5E7EB"/>
  <rect x="30" y="90" width="0" height="12" rx="6" fill="#CDF0EA">
    <animate attributeName="width" from="0" to="240" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="340" y="100" font-family="monospace" font-size="11">React</text>

  <!-- Flutter -->
  <rect x="30" y="112" width="300" height="12" rx="6" fill="#E5E7EB"/>
  <rect x="30" y="112" width="0" height="12" rx="6" fill="#FAF4B7">
    <animate attributeName="width" from="0" to="220" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="340" y="122" font-family="monospace" font-size="11">Flutter</text>

  <!-- TypeScript -->
  <rect x="30" y="134" width="300" height="12" rx="6" fill="#E5E7EB"/>
  <rect x="30" y="134" width="0" height="12" rx="6" fill="#F6C6EA">
    <animate attributeName="width" from="0" to="260" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="340" y="144" font-family="monospace" font-size="11">TypeScript</text>

  <!-- stats panel -->
  <rect x="30" y="170" width="320" height="150" rx="6" fill="#FFFFFF"/>

  <image
    href="https://github-readme-stats.vercel.app/api?username=AriadnaVillagra&show_icons=true&hide_border=true&theme=dark&bg_color=FFFFFF&title_color=F2A7D5&icon_color=F2A7D5"
    x="34"
    y="174"
    width="312"
  />

  <!-- language panel -->
  <rect x="360" y="170" width="300" height="150" rx="6" fill="#FFFFFF"/>

  <image
    href="https://github-readme-stats.vercel.app/api/top-langs/?username=AriadnaVillagra&layout=compact&hide_border=true&theme=dark&bg_color=FFFFFF&title_color=F2A7D5"
    x="364"
    y="174"
    width="292"
  />

  <!-- console -->
  <rect x="30" y="340" width="630" height="70" rx="6" fill="#111827"/>

  <text x="46" y="364" font-family="monospace" font-size="12" fill="#9CA3AF">
    > building something interesting...
  </text>

  <text x="46" y="382" font-family="monospace" font-size="12" fill="#9CA3AF">
    > compiling ideas into code
  </text>

  <text x="46" y="400" font-family="monospace" font-size="12" fill="#9CA3AF">
    > status: works on my machine
  </text>

  <!-- daria -->
  <image
    href="https://raw.githubusercontent.com/AriadnaVillagra/AriadnaVillagra/assets/daria.gif"
    x="560"
    y="346"
    width="80"
  />

